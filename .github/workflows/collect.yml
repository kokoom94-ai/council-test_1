name: 회의록 수집
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 수집 실행
        run: python3 scripts/collect_speeches.py --daesu 13 --th 453 --out data/speeches.json
      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/speeches.json
          git diff --staged --quiet || git commit -m "회의록 수집"
          git push
